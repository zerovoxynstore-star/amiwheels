<!DOCTYPE html><html lang="id"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AmiWheels Customer</title><link rel="stylesheet" href="style.css"></head><body>
<div class="app">
<header class="top"><div><div class="logo">Ami<span>Wheels</span></div><div class="tag">Customer Marketplace</div></div><a class="btn dark" href="admin.html">Admin</a></header>
<div class="main">
 <section class="hero customer">
  <div><span class="pill">Die-cast Marketplace</span><h1>Temukan Koleksi Die-cast Favoritmu</h1><p>Standar, premium, track set, display, blister, dan koleksi langka.</p></div>
 </section>
 <input id="q" class="search" placeholder="Cari produk..." oninput="renderCustomer()">
 <div class="categories">
  <button class="cat" onclick="setCat('all')"><i>🔎</i>Semua</button>
  <button class="cat" onclick="setCat('Mobil Die-cast Standar')"><i>🚗</i>Standar</button>
  <button class="cat" onclick="setCat('Koleksi Premium')"><i>⭐</i>Premium</button>
  <button class="cat" onclick="setCat('Arena Bermain / Track Set')"><i>🏁</i>Track</button>
  <button class="cat" onclick="setCat('Display & Blister')"><i>📦</i>Display</button>
 </div>
 <div class="section-head"><h2>Ready Stock</h2></div>
 <div id="active" class="product-grid"></div>
 <div class="section-head"><h2 style="color:#ef4444">Sold Out</h2></div>
 <div id="soldout" class="product-grid"></div>
</div>
<nav class="bottom customer-bottom">
 <a class="active" href="index.html">🏠<span>Home</span></a>
 <button onclick="document.getElementById('q').focus()">🔍<span>Cari</span></button>
 <a href="admin.html">🛠️<span>Admin</span></a>
 <a href="https://wa.me/6281234567890" target="_blank">💬<span>WA</span></a>
</nav>
</div>
<script src="shared.js"></script>
<script>
let category="all";
function setCat(c){category=c;renderCustomer()}
function renderCustomer(){
 const q=document.getElementById("q").value||"";
 const data=filtered(q,category);
 const active=data.filter(p=>p.status==="active");
 const soldout=data.filter(p=>p.status==="soldout");
 document.getElementById("active").innerHTML=active.map(p=>card(p,true)).join("")||"<p>Belum ada produk.</p>";
 document.getElementById("soldout").innerHTML=soldout.map(p=>card(p,true)).join("")||"<p>Belum ada produk sold out.</p>";
}
renderCustomer();
</script></body></html>
