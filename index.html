<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AmiWheels - Jual Beli Hot Wheels</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">Ami<span>Wheels</span></div>
      <button class="icon-btn" aria-label="Notifikasi">🔔</button>
    </header>

    <main>
      <section id="beranda" class="page active">
        <div class="search-wrap">
          <input id="searchInput" type="search" placeholder="Cari Hot Wheels, display, dll..." />
          <span>🔍</span>
        </div>

        <section class="hero-card">
          <div>
            <p class="eyebrow">HOT WHEELS MARKETPLACE</p>
            <h1>Jual • Beli • Tukar<br/>Koleksi Terbaikmu</h1>
            <button onclick="scrollToProducts()">Jelajahi Sekarang</button>
          </div>
          <div class="hero-car">🏎️</div>
        </section>

        <div class="section-title">
          <h2>Kategori</h2>
          <button onclick="showPage('kategori')">Lihat Semua ›</button>
        </div>
        <div class="category-grid compact" id="homeCategories"></div>

        <div class="section-title" id="produk">
          <h2>Produk Terbaru</h2>
          <button onclick="showPage('kategori')">Lihat Semua ›</button>
        </div>
        <div class="product-grid" id="productGrid"></div>
      </section>

      <section id="detail" class="page">
        <button class="back-btn" onclick="showPage('beranda')">‹ Kembali</button>
        <div id="detailContent"></div>
      </section>

      <section id="jual" class="page">
        <h2 class="page-title">Jual Produk</h2>
        <form class="sell-form" onsubmit="sendListing(event)">
          <label>Foto Produk</label>
          <div class="upload-box">📷<br/>Tambah Foto</div>
          <label>Nama Produk</label>
          <input id="sellName" required placeholder="Contoh: Nissan Skyline GT-R R34" />
          <label>Harga</label>
          <input id="sellPrice" required type="number" placeholder="Contoh: 75000" />
          <label>Kategori</label>
          <select id="sellCategory" required>
            <option value="">Pilih Kategori</option>
            <option>Loose</option><option>Blister</option><option>Display</option><option>Protector</option><option>Premium</option><option>TH</option><option>STH</option><option>Aksesoris</option>
          </select>
          <label>Kondisi</label>
          <select id="sellCondition" required>
            <option value="">Pilih Kondisi</option>
            <option>Mint</option><option>Near Mint</option><option>Good</option><option>Loose</option><option>Blister Rusak</option><option>Baru</option>
          </select>
          <label>Lokasi</label>
          <input id="sellLocation" placeholder="Contoh: Jakarta Timur" />
          <label>Deskripsi</label>
          <textarea id="sellDesc" placeholder="Tulis deskripsi produk..."></textarea>
          <label>Nomor WhatsApp</label>
          <input id="sellWa" placeholder="Contoh: 62812xxxxxxx" />
          <button class="primary-btn" type="submit">Posting Produk</button>
        </form>
      </section>

      <section id="kategori" class="page">
        <h2 class="page-title">Kategori</h2>
        <div class="category-list" id="categoryList"></div>
      </section>

      <section id="favorit" class="page">
        <h2 class="page-title">Favorit</h2>
        <div class="product-grid" id="favoriteGrid"></div>
      </section>

      <section id="akun" class="page">
        <h2 class="page-title">Akun</h2>
        <div class="profile-card">
          <div class="avatar">AW</div>
          <div><h3>AmiWheels Garage</h3><p>⭐ 4.9 (120 Ulasan)</p></div>
        </div>
        <div class="stats"><div><b>120</b><span>Produk Dijual</span></div><div><b>85</b><span>Transaksi</span></div><div><b>98%</b><span>Rating Positif</span></div></div>
        <div class="menu-list">
          <button>🛍️ Produk Saya ›</button><button>📦 Transaksi ›</button><button>📋 Pesanan ›</button><button>♡ Favorit ›</button><button>⚙️ Pengaturan Akun ›</button><button>❔ Bantuan & Panduan ›</button><button>ℹ️ Tentang AmiWheels ›</button><button class="logout">↪ Keluar</button>
        </div>
      </section>
    </main>

    <nav class="bottom-nav">
      <button class="nav-item active" onclick="showPage('beranda', this)">⌂<span>Beranda</span></button>
      <button class="nav-item" onclick="showPage('kategori', this)">▦<span>Kategori</span></button>
      <button class="nav-add" onclick="showPage('jual')">＋<span>Jual</span></button>
      <button class="nav-item" onclick="showPage('favorit', this)">♡<span>Favorit</span></button>
      <button class="nav-item" onclick="showPage('akun', this)">♙<span>Akun</span></button>
    </nav>
  </div>
  <script src="app.js"></script>
</body>
</html>
